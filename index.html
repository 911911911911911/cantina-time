<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cantina Zeiterfassung</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 0; margin-bottom: 24px; }
    label { display: block; text-align: left; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }
    .btn-group { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 16px 8px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .btn-in { background-color: #22c55e; color: #022c22; }
    .btn-out { background-color: #ef4444; color: #450a0a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .success { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .error { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Cantina Zeiterfassung</h1>
    <p class="subtitle">Arbeitszeit erfassen</p>

    <label for="employee">Mitarbeiter:</label>
    <select id="employee">
      <option value="Leni">Leni</option>
      <option value="Anton">Anton</option>
      <option value="Vesela">Vesela</option>
      <option value="Andrey">Andrey</option>
    </select>

    <div class="btn-group">
      <button class="btn-in" onclick="sendStamp('kommen')">Kommen</button>
      <button class="btn-out" onclick="sendStamp('gehen')">Gehen</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOJxviLIIfidTsMS8zzbZYa9rwH4th19HOooerig0CtOwgcB32QGfD6_aOiRKs7677dA/exec";

    async function sendStamp(actionType) {
      const select = document.getElementById("employee");
      const name = select.value;
      const statusDiv = document.getElementById("status");
      const buttons = document.querySelectorAll("button");

      buttons.forEach(b => b.disabled = true);
      statusDiv.style.display = "block";
      statusDiv.className = "";
      statusDiv.innerText = "Wird gesendet...";

      const payload = {
        name: name,
        action: actionType
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          statusDiv.className = "success";
          statusDiv.innerText = `Erfolgreich! ${result.name} - ${actionType.toUpperCase()} um ${result.time} Uhr eingetragen.`;
        } else {
          statusDiv.className = "error";
          statusDiv.innerText = "Fehler: " + result.message;
        }
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.innerText = "Verbindungsfehler oder Anfrage blockiert.";
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    }
  </script>
</body>
</html>
