<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cantina Zeiterfassung</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #263449;
      --text: #f8fafc;
      --sub: #94a3b8;
      --border: #334155;
      --green: #22c55e;
      --green-h: #16a34a;
      --red: #ef4444;
      --red-h: #dc2626;
      --blue: #3b82f6;
      --blue-h: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, var(--bg) 60%);
      color: var(--text);
      display: flex; justify-content: center; align-items: center;
      padding: 16px; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    .card {
      width: 100%; max-width: 520px;
      background: var(--card); border: 1px solid var(--border); border-radius: 22px;
      padding: clamp(18px, 4vw, 32px);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: clamp(12px, 2.2vh, 20px);
    }
    [hidden] { display: none !important; }
    h1 { font-size: clamp(1.3rem, 3.4vw, 1.7rem); text-align: center; letter-spacing: -.4px; }
    .subtitle { text-align: center; color: var(--sub); font-size: .9rem; margin-top: -8px; }

    /* PIN */
    .dots { display: flex; justify-content: center; gap: 16px; padding: 6px 0; }
    .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--sub); transition: all .12s; }
    .dot.on { background: var(--blue); border-color: var(--blue); transform: scale(1.1); }
    .pin-msg { min-height: 1.4em; text-align: center; font-size: .95rem; color: #f87171; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.8vw, 14px); }
    .key {
      background: var(--card-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 16px; font-size: clamp(1.5rem, 4.5vw, 2rem); font-weight: 600;
      height: clamp(58px, 10vh, 84px); cursor: pointer; touch-action: manipulation;
      transition: transform .06s, background .15s;
    }
    .key:active { transform: scale(.96); background: #324562; }
    .key.fn { font-size: 1.3rem; color: var(--sub); background: transparent; }

    /* Buttons */
    .btn {
      border: none; border-radius: 16px; color: #fff; font-weight: 700; cursor: pointer;
      font-size: clamp(1.1rem, 3.2vw, 1.35rem); padding: clamp(16px, 3vh, 24px) 12px;
      touch-action: manipulation; transition: transform .06s, background .15s, opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.blue { background: var(--blue); } .btn.blue:hover:not(:disabled) { background: var(--blue-h); }
    .btn.green { background: var(--green); } .btn.green:hover:not(:disabled) { background: var(--green-h); }
    .btn.red { background: var(--red); } .btn.red:hover:not(:disabled) { background: var(--red-h); }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 1.05rem; padding: 14px; }
    .btn.link { background: transparent; color: var(--sub); font-weight: 500; font-size: .95rem; padding: 10px; }

    /* Menü */
    .hello { text-align: center; font-size: clamp(1.5rem, 4.6vw, 2.1rem); font-weight: 700; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .schank {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3);
      border-radius: 14px; padding: 14px; color: #93c5fd; font-weight: 600; font-size: 1.05rem; cursor: pointer;
    }
    .schank input { width: 26px; height: 26px; accent-color: var(--blue); }

    /* Ergebnis */
    .result { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 8px 0; }
    .result .icon { font-size: 3.6rem; line-height: 1; }
    .result .title { font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 700; }
    .result .detail { color: var(--sub); font-size: 1.05rem; line-height: 1.5; }
    .result.ok .title { color: #4ade80; } .result.err .title { color: #f87171; }
    .bar { width: 100%; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 100%; background: var(--blue); transform-origin: left; }
    .bar.run > i { animation: shrink 5s linear forwards; }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* Verlauf */
    .hist-wrap { max-height: 52vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    th { position: sticky; top: 0; background: var(--card-2); color: var(--sub); text-align: left; padding: 10px 8px; font-weight: 600; }
    td { padding: 11px 8px; border-top: 1px solid rgba(51,65,85,.6); }
    .total { text-align: center; color: #38bdf8; font-weight: 700; font-size: 1.1rem; }
    .empty { text-align: center; color: var(--sub); padding: 18px; }
    .spinner { text-align: center; color: var(--sub); padding: 18px; }
  </style>
</head>
<body>

  <!-- 1) PIN-Eingabe -->
  <main class="card" id="screenPin">
    <h1>Cantina Zeiterfassung</h1>
    <div class="subtitle">Pasinger Fabrik · PIN eingeben</div>
    <div class="dots" id="dots" aria-label="PIN-Eingabe">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="pin-msg" id="pinMsg" role="alert"></div>
    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key fn" data-k="clear" aria-label="Löschen">C</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="back" aria-label="Zurück">⌫</button>
    </div>
    <button class="btn blue" id="btnNext" disabled>Weiter</button>
  </main>

  <!-- 2) Menü -->
  <main class="card" id="screenMenu" hidden>
    <div class="hello" id="hello">Hallo!</div>
    <label class="schank" id="schankBox" hidden>
      <input type="checkbox" id="schankOpt"> Schankdienst (S)
    </label>
    <div class="row2">
      <button class="btn green" id="btnKommen">🟢 Kommen</button>
      <button class="btn red" id="btnGehen">🔴 Gehen</button>
    </div>
    <button class="btn ghost" id="btnHistory">📋 Meine Arbeitszeiten</button>
    <button class="btn link" id="btnCancel">Abbrechen</button>
  </main>

  <!-- 3) Ergebnis -->
  <main class="card" id="screenResult" hidden>
    <div class="result" id="resultBox">
      <div class="icon" id="resIcon"></div>
      <div class="title" id="resTitle"></div>
      <div class="detail" id="resDetail"></div>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <button class="btn link" id="btnNow">Sofort zurück</button>
  </main>

  <!-- 4) Verlauf -->
  <main class="card" id="screenHistory" hidden>
    <h1 id="histTitle">Meine Arbeitszeiten</h1>
    <div id="histLoading" class="spinner">Laden …</div>
    <div class="hist-wrap" id="histWrap" hidden>
      <table>
        <thead><tr><th>Tag</th><th>Von</th><th>Bis</th><th>Pause</th><th>Std.</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
    <div class="total" id="histTotal" hidden></div>
    <button class="btn ghost" id="btnHistBack">Zurück</button>
    <button class="btn link" id="btnHistDone">Fertig</button>
  </main>

<script>
  // URL der Apps-Script-Web-App (bei "Bereitstellungen verwalten -> Neue Version" bleibt sie gleich)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOJxviLIIfidTsMS8zzbZYa9rwH4th19HOooerig0CtOwgcB32QGfD6_aOiRKs7677dA/exec";
  const RESET_SECONDS = 5;   // Rücksprung nach Erfolg/Fehler
  const IDLE_SECONDS = 45;   // Rücksprung bei Inaktivität im Menü/Verlauf
  const TIMEOUT_MS = 20000;

  const $ = (id) => document.getElementById(id);
  const screens = ["screenPin", "screenMenu", "screenResult", "screenHistory"];

  let pin = "";
  let session = null;      // { pin, name, displayName, canSchank }
  let busy = false;
  let resetTimer = null;
  let idleTimer = null;

  // ---------- Hilfsfunktionen ----------
  function show(id) {
    screens.forEach((s) => { $(s).hidden = (s !== id); });
  }

  function fmt(n) {
    const v = Number(n);
    return isNaN(v) ? String(n) : v.toFixed(2).replace(".", ",");
  }

  async function api(payload) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      return await res.json();
    } finally {
      clearTimeout(t);
    }
  }

  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(resetToPin, IDLE_SECONDS * 1000);
  }

  // ---------- PIN-Screen ----------
  function renderDots() {
    document.querySelectorAll("#dots .dot").forEach((d, i) => d.classList.toggle("on", i < pin.length));
    $("btnNext").disabled = busy || pin.length < 4;
  }

  function pressKey(k) {
    if (busy) return;
    $("pinMsg").textContent = "";
    if (k === "back") pin = pin.slice(0, -1);
    else if (k === "clear") pin = "";
    else if (/^\d$/.test(k) && pin.length < 4) pin += k;
    renderDots();
  }

  async function submitPin() {
    if (busy || pin.length < 4) return;
    busy = true; renderDots();
    $("pinMsg").style.color = "#94a3b8";
    $("pinMsg").textContent = "Prüfe PIN …";
    try {
      const res = await api({ action: "verifyPin", pin });
      if (res.status === "success") {
        session = { pin, name: res.name, displayName: res.displayName || res.name, canSchank: !!res.canSchank };
        pin = "";
        openMenu();
      } else {
        $("pinMsg").style.color = "#f87171";
        $("pinMsg").textContent = res.message || "Fehler";
        pin = "";
      }
    } catch (e) {
      $("pinMsg").style.color = "#f87171";
      $("pinMsg").textContent = "Verbindungsfehler zum Server.";
      pin = "";
    }
    busy = false; renderDots();
  }

  // ---------- Menü ----------
  function openMenu() {
    $("hello").textContent = "Hallo, " + session.displayName + "!";
    $("schankBox").hidden = !session.canSchank;
    $("schankOpt").checked = false;
    setMenuDisabled(false);
    show("screenMenu");
    armIdle();
  }

  function setMenuDisabled(d) {
    ["btnKommen", "btnGehen", "btnHistory", "btnCancel"].forEach((id) => { $(id).disabled = d; });
  }

  async function stamp(action) {
    if (busy || !session) return;
    busy = true; setMenuDisabled(true);
    clearTimeout(idleTimer);
    try {
      const res = await api({ action, pin: session.pin, isSchank: $("schankOpt").checked });
      if (res.status === "success") {
        if (action === "kommen") {
          showResult(true, "Willkommen, " + session.displayName + "!", "Gekommen um " + res.time + " Uhr erfasst.");
        } else {
          showResult(true, "Feierabend, " + session.displayName + "!",
            "Gegangen um " + res.time + " Uhr.\nHeute: " + fmt(res.todayHours) + " Std. (Pause: " + fmt(res.todayPause) + " h)\nMonat gesamt: " + fmt(res.totalMonthHours) + " Std.");
        }
      } else {
        showResult(false, "Nicht gespeichert", res.message || "Unbekannter Fehler");
      }
    } catch (e) {
      showResult(false, "Verbindungsfehler", "Bitte erneut versuchen.");
    }
    busy = false;
  }

  // ---------- Ergebnis ----------
  function showResult(ok, title, detail) {
    $("resultBox").className = "result " + (ok ? "ok" : "err");
    $("resIcon").textContent = ok ? "✅" : "❌";
    $("resTitle").textContent = title;
    $("resDetail").textContent = detail;
    $("resDetail").style.whiteSpace = "pre-line";
    show("screenResult");

    const bar = $("bar");
    bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetToPin, RESET_SECONDS * 1000);
  }

  // ---------- Verlauf ----------
  async function openHistory() {
    if (busy || !session) return;
    busy = true;
    $("histTitle").textContent = "Arbeitszeiten: " + session.displayName;
    $("histLoading").hidden = false;
    $("histWrap").hidden = true;
    $("histTotal").hidden = true;
    $("histBody").replaceChildren();
    show("screenHistory");
    armIdle();

    try {
      const res = await api({ action: "getHistory", pin: session.pin });
      $("histLoading").hidden = true;
      if (res.status !== "success") {
        $("histLoading").hidden = false;
        $("histLoading").textContent = res.message || "Fehler beim Laden.";
      } else {
        const body = $("histBody");
        if (!res.history || res.history.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 5; td.className = "empty"; td.textContent = "Noch keine Schichten erfasst.";
          tr.appendChild(td); body.appendChild(tr);
        } else {
          res.history.forEach((r) => {
            const tr = document.createElement("tr");
            [r.day, r.von || "–", r.bis || "–", r.pause !== "" && r.pause !== 0 ? fmt(r.pause) + " h" : "–", r.std !== "" ? fmt(r.std) : "–"].forEach((v, i) => {
              const td = document.createElement("td");
              td.textContent = v;
              if (i === 4) td.style.fontWeight = "700";
              tr.appendChild(td);
            });
            body.appendChild(tr);
          });
        }
        $("histWrap").hidden = false;
        $("histTotal").textContent = "Gesamt Monat: " + fmt(res.totalMonthHours) + " Std.";
        $("histTotal").hidden = false;
      }
    } catch (e) {
      $("histLoading").hidden = false;
      $("histLoading").textContent = "Verbindungsfehler beim Laden.";
    }
    busy = false;
  }

  // ---------- Zurücksetzen ----------
  function resetToPin() {
    clearTimeout(resetTimer);
    clearTimeout(idleTimer);
    session = null; pin = ""; busy = false;
    $("pinMsg").textContent = "";
    $("schankOpt").checked = false;
    $("histBody").replaceChildren();
    renderDots();
    show("screenPin");
  }

  // ---------- Events ----------
  $("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (b) pressKey(b.dataset.k);
  });
  $("btnNext").addEventListener("click", submitPin);
  $("btnKommen").addEventListener("click", () => stamp("kommen"));
  $("btnGehen").addEventListener("click", () => stamp("gehen"));
  $("btnHistory").addEventListener("click", openHistory);
  $("btnCancel").addEventListener("click", resetToPin);
  $("btnNow").addEventListener("click", resetToPin);
  $("btnHistBack").addEventListener("click", () => { if (session) openMenu(); else resetToPin(); });
  $("btnHistDone").addEventListener("click", resetToPin);

  // Aktivität verlängert die Inaktivitäts-Frist (Menü + Verlauf)
  document.addEventListener("pointerdown", () => {
    if (!$("screenMenu").hidden || !$("screenHistory").hidden) armIdle();
  });

  // Hardware-Tastatur (falls vorhanden)
  document.addEventListener("keydown", (e) => {
    if ($("screenPin").hidden) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") pressKey("back");
    else if (e.key === "Escape") pressKey("clear");
    else if (e.key === "Enter") submitPin();
  });

  // Doppeltipp-Zoom verhindern
  let lastTouch = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  resetToPin();
</script>
</body>
</html>
