    :root {
      --ink: #14332D;        /* Tannengrün: Fläche der Uhr, Text */
      --ink-d: #0A1F1B;
      --sheet: #F3F5F4;      /* Fliesenweiß */
      --tile: #FFFFFF;
      --edge: #C9D4D0;
      --lip: #B5C3BE;        /* Unterkante der Tasten */
      --sub: #4F6660;
      --panel-sub: #B9CBC5;
      --green: #137A45;  --green-d: #0B5230;
      --red: #C2352A;    --red-d: #86221A;
      --amber-bg: #FFF3D6; --amber-edge: #E8B94A; --amber-ink: #6B4A00;
      --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { touch-action: manipulation; }
    html, body { min-height: 100%; }
    body {
      background: var(--ink); color: var(--ink);
      font-family: var(--font); font-weight: 500; line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    button, input { font-family: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }

    /* ---------- Uhr (steht auf jedem Bildschirm) ---------- */
    .clock {
      color: #fff;
      padding: max(18px, env(safe-area-inset-top)) 24px 44px;
      display: grid; grid-template-columns: 1fr auto; align-items: start; row-gap: 14px;
      background-color: var(--ink);
      background-image:
        linear-gradient(rgba(255,255,255,.055) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,255,255,.055) 2px, transparent 2px);
      background-size: 64px 64px; background-position: -1px -1px;
    }
    .brand-name { font-weight: 700; font-size: 1.3rem; letter-spacing: -.01em; line-height: 1.1; }
    .brand-sub { color: var(--panel-sub); font-size: .9rem; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; align-self: start;
      background: rgba(255,255,255,.1); border-radius: 99px; padding: 6px 14px 6px 12px; font-size: .88rem;
    }
    .status i { width: 10px; height: 10px; border-radius: 50%; background: #5BD38C; flex: none; }
    .status.bad { background: rgba(242,182,58,.18); color: #FFE2A0; }
    .status.bad i { background: #F2B63A; }
    .when { grid-column: 1 / -1; }
    .time {
      font-weight: 700; font-size: clamp(4rem, 17vw, 9rem); line-height: .95; letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
    }
    .date { color: var(--panel-sub); font-size: clamp(1rem, 3vw, 1.25rem); margin-top: 8px; }

    /* ---------- Fläche mit den Bildschirmen ---------- */
    .sheet {
      background: var(--sheet); border-radius: 28px 28px 0 0; margin-top: -24px; position: relative;
      padding: clamp(20px, 3.5vh, 36px) 20px max(28px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: center;
    }
    .screen { width: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 18px); }

    @media (min-width: 880px) and (min-aspect-ratio: 6/5) {
      .app { grid-template-columns: minmax(340px, 40%) 1fr; grid-template-rows: 1fr; }
      .clock { padding: 40px 44px; grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; row-gap: 0; align-items: stretch; }
      .clock .brand { grid-row: 1; }
      .clock .when { grid-row: 2; align-self: center; grid-column: 1; }
      .clock .status { grid-row: 3; justify-self: start; }
      .time { font-size: clamp(5.5rem, 11vw, 9.5rem); }
      .sheet { border-radius: 0; margin-top: 0; padding: 40px; }
      .screen { max-width: 480px; }
    }

    /* ---------- Überschriften ---------- */
    h1 { font-size: clamp(1.5rem, 3.6vw, 1.9rem); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
    .hello { font-weight: 700; font-size: clamp(1.7rem, 4.6vw, 2.3rem); line-height: 1.15; letter-spacing: -.01em; }

    /* ---------- PIN ---------- */
    .dots { display: flex; gap: 18px; padding: 4px 0; }
    .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); transition: background .1s; }
    .dot.on { background: var(--ink); }
    .dots.shake { animation: shake .35s; }
    @keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
    .pin-msg { min-height: 1.5em; font-size: .95rem; font-weight: 500; }
    .pin-msg.info { color: var(--sub); }
    .pin-msg.err { color: #B3261E; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.6vh, 14px); }
    .key {
      background: var(--tile); color: var(--ink); border: 1px solid var(--edge); border-radius: 18px;
      box-shadow: 0 3px 0 var(--lip);
      font-weight: 700; font-size: clamp(1.7rem, 4.4vw, 2.2rem); line-height: 1;
      height: clamp(56px, 9vh, 92px); cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      transition: transform .05s, box-shadow .05s;
    }
    .key:active { transform: translateY(3px); box-shadow: 0 0 0 var(--lip); }
    .key.fn { background: transparent; border-color: transparent; box-shadow: none; color: var(--sub); font-size: 1rem; font-weight: 700; }
    .key.fn:active { transform: none; background: rgba(20,51,45,.08); }
    .key svg { width: 30px; height: 30px; }

    /* ---------- Schaltflächen ---------- */
    .btn {
      border: none; border-radius: 18px; cursor: pointer; width: 100%;
      font-weight: 700; font-size: 1.15rem; padding: 17px 16px; line-height: 1.2;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      touch-action: manipulation; transition: transform .05s, box-shadow .05s, opacity .15s;
    }
    .btn svg { width: 24px; height: 24px; flex: none; }
    .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none !important; }
    .btn.primary { background: var(--ink); color: #fff; box-shadow: 0 4px 0 var(--ink-d); }
    .btn.green { background: var(--green); color: #fff; box-shadow: 0 5px 0 var(--green-d); }
    .btn.red { background: var(--red); color: #fff; box-shadow: 0 5px 0 var(--red-d); }
    .btn.ghost { background: var(--tile); color: var(--ink); border: 1px solid var(--edge); box-shadow: 0 3px 0 var(--lip); font-size: 1.05rem; }
    .btn.link { background: transparent; color: var(--sub); font-weight: 500; font-size: .95rem; padding: 12px; }
    .btn:active:not(:disabled):not(.link) { transform: translateY(3px); box-shadow: none; }

    /* ---------- Menü ---------- */
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .btn.big { flex-direction: column; gap: 12px; font-size: clamp(1.3rem, 3.4vw, 1.6rem); min-height: clamp(130px, 21vh, 180px); }
    .btn.big svg { width: 44px; height: 44px; }
    .schank {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer;
      background: var(--tile); border: 1px solid var(--edge); border-radius: 18px; padding: 14px 18px;
      font-weight: 700; font-size: 1.05rem;
    }
    .schank input {
      appearance: none; -webkit-appearance: none; flex: none; width: 54px; height: 32px; border-radius: 99px;
      background: var(--lip); position: relative; transition: background .15s; cursor: pointer;
    }
    .schank input::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
      background: #fff; transition: transform .15s;
    }
    .schank input:checked { background: var(--green); }
    .schank input:checked::after { transform: translateX(22px); }

    /* ---------- Hinweise ---------- */
    .notice {
      background: var(--amber-bg); border: 1px solid var(--amber-edge); color: var(--amber-ink);
      border-radius: 14px; padding: 12px 14px; font-size: .9rem; line-height: 1.45;
      display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    }
    .notice .btn.link { width: auto; padding: 6px 0; color: var(--amber-ink); font-weight: 700; text-decoration: underline; }

    /* ---------- Ergebnis: Bon ---------- */
    .result { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .badge { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
    .badge svg { width: 40px; height: 40px; }
    .result.ok .badge { background: var(--green); }
    .result.err .badge { background: var(--red); }
    .result.wait .badge { background: #D79A14; }
    .result .title { font-weight: 700; font-size: clamp(1.6rem, 4.4vw, 2.1rem); line-height: 1.15; letter-spacing: -.01em; }
    .result.err .title { color: #B3261E; }
    .result .detail { color: var(--sub); font-size: 1.02rem; line-height: 1.5; white-space: pre-line; max-width: 36ch; }
    .ticket-wrap { width: 100%; filter: drop-shadow(0 10px 10px rgba(20,51,45,.16)); margin-top: 4px; }
    .ticket {
      --t: 12px;
      background: var(--tile); text-align: left; padding: 22px 24px calc(26px + var(--t) / 2);
      border-radius: 10px 10px 0 0;
      -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--t) calc(var(--t) / 2) repeat-x, linear-gradient(#000 0 0) top / 100% calc(100% - var(--t) / 2) no-repeat;
              mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--t) calc(var(--t) / 2) repeat-x, linear-gradient(#000 0 0) top / 100% calc(100% - var(--t) / 2) no-repeat;
    }
    .tk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .tk-label { color: var(--sub); font-weight: 700; font-size: 1.05rem; }
    .tk-time { font-weight: 700; font-size: clamp(2.6rem, 8vw, 3.6rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .tk-time small { font-size: 1rem; font-weight: 500; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
    .tk-rows { margin-top: 16px; border-top: 2px dashed var(--edge); }
    .tk-rows:empty { display: none; }
    .tk-row { display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; font-size: 1.05rem; }
    .tk-row span { color: var(--sub); }
    .tk-row b { font-weight: 700; }
    .bar { width: 100%; height: 6px; background: var(--edge); border-radius: 99px; overflow: hidden; margin-top: 10px; }
    .bar > i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
    .bar.run > i { animation: shrink 5s linear forwards; }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* ---------- Verlauf ---------- */
    .hist-wrap { max-height: min(52vh, 560px); overflow-y: auto; background: var(--tile); border: 1px solid var(--edge); border-radius: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    th { position: sticky; top: 0; background: var(--tile); color: var(--sub); text-align: left; padding: 12px 10px; font-weight: 700; font-size: .88rem; border-bottom: 2px solid var(--edge); }
    td { padding: 12px 10px; border-top: 1px solid #E3EAE7; font-variant-numeric: tabular-nums; }
    tbody tr:first-child td { border-top: none; }
    td:first-child { font-weight: 700; }
    td:nth-child(1), td:nth-child(4), td:nth-child(5) { white-space: nowrap; }
    @media (max-width: 480px) { th, td { padding-left: 8px; padding-right: 6px; } table { font-size: .93rem; } }
    .total { background: var(--ink); color: #fff; border-radius: 16px; padding: 14px 18px; text-align: center; font-weight: 700; font-size: 1.15rem; }
    .empty, .spinner { text-align: center; color: var(--sub); padding: 18px; }

    @media (prefers-reduced-motion: reduce) {
      .dots.shake { animation: none; }
      .key, .btn, .dot { transition: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Uhr und Verbindungsstatus: immer sichtbar -->
  <header class="clock">
    <div class="brand">
      <div class="brand-name">Cantina</div>
      <div class="brand-sub">Pasinger Fabrik</div>
    </div>
    <div class="status" id="status"><i></i><span id="statusText">Verbunden</span></div>
    <div class="when">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate"></div>
    </div>
  </header>

  <main class="sheet">

    <!-- 1) PIN-Eingabe -->
    <section class="screen" id="screenPin">
      <h1>PIN eingeben</h1>
      <div class="notice" id="banner" hidden></div>
      <div class="dots" id="dots" role="img" aria-label="PIN-Eingabe">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="pin-msg" id="pinMsg" role="alert"></div>
      <div class="pad" id="pad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key fn" data-k="clear" aria-label="Eingabe löschen">Löschen</button>
        <button class="key" data-k="0">0</button>
        <button class="key fn" data-k="back" aria-label="Letzte Ziffer löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>
        </button>
      </div>
      <button class="btn primary" id="btnNext" disabled>Weiter</button>
    </section>

    <!-- 2) Menü -->
    <section class="screen" id="screenMenu" hidden>
      <div class="hello" id="hello">Hallo!</div>
      <div class="notice" id="offlineNote" hidden>Keine Verbindung – deine Buchung wird gesichert und automatisch übertragen.</div>
      <label class="schank" id="schankBox" hidden>
        <span>Schankdienst (S)</span>
        <input type="checkbox" id="schankOpt">
      </label>
      <div class="row2">
        <button class="btn big green" id="btnKommen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          Kommen
        </button>
        <button class="btn big red" id="btnGehen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Gehen
        </button>
      </div>
      <button class="btn ghost" id="btnHistory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Meine Arbeitszeiten
      </button>
      <button class="btn link" id="btnCancel">Abbrechen</button>
    </section>

    <!-- 3) Ergebnis -->
    <section class="screen" id="screenResult" hidden>
      <div class="result" id="resultBox">
        <div class="badge" id="resIcon"></div>
        <div class="title" id="resTitle"></div>
        <div class="ticket-wrap" id="ticketWrap" hidden>
          <div class="ticket">
            <div class="tk-head"><span class="tk-label" id="tkLabel"></span><span class="tk-time"><span id="tkTime"></span><small>Uhr</small></span></div>
            <div class="tk-rows" id="tkRows"></div>
          </div>
        </div>
        <div class="detail" id="resDetail"></div>
      </div>
      <div class="bar" id="bar"><i></i></div>
      <button class="btn link" id="btnNow">Sofort zurück</button>
    </section>

    <!-- 4) Verlauf -->
    <section class="screen" id="screenHistory" hidden>
      <h1 id="histTitle">Meine Arbeitszeiten</h1>
      <div id="histLoading" class="spinner">Laden …</div>
      <div class="hist-wrap" id="histWrap" hidden>
        <table>
          <thead><tr><th>Tag</th><th>Von</th><th>Bis</th><th>Pause</th><th>Std.</th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
      <div class="total" id="histTotal" hidden></div>
      <button class="btn ghost" id="btnHistBack">Zurück</button>
      <button class="btn link" id="btnHistDone">Fertig</button>
    </section>

  </main>
</div>

<script>
  // URL der Apps-Script-Web-App (bei "Bereitstellungen verwalten -> Neue Version" bleibt sie gleich)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOJxviLIIfidTsMS8zzbZYa9rwH4th19HOooerig0CtOwgcB32QGfD6_aOiRKs7677dA/exec";
  const RESET_SECONDS = 5;            // Rücksprung nach Erfolg/Fehler
  const IDLE_SECONDS = 45;            // Rücksprung bei Inaktivität im Menü/Verlauf
  const FG_TIMEOUT_MS = 12000;        // Vordergrund: Wartezeit pro Versuch
  const FG_ATTEMPTS = 2;              // Vordergrund: Versuche; danach wird die Buchung gesichert und später übertragen
  const BG_TIMEOUT_MS = 20000;        // Hintergrund-Übertragung: Wartezeit pro Versuch
  const RETRY_DELAY_MS = 1500;
  const SYNC_INTERVAL_MS = 30000;     // so oft wird eine gesicherte Buchung erneut übertragen
  const MAX_SERVER_RETRIES = 20;      // so oft darf der Server "bitte wiederholen" melden, bevor die Buchung als Problem gemeldet wird
  const KEEPALIVE_MS = 4 * 60 * 1000; // hält die Web-App warm (weniger Kaltstart-Verzögerung)
  const LS = { queue: "cz_queue_v1", rejected: "cz_rejected_v1", pins: "cz_pins_v1", offset: "cz_offset_v1" };

  const $ = (id) => document.getElementById(id);
  const screens = ["screenPin", "screenMenu", "screenResult", "screenHistory"];

  let pin = "";
  let session = null;      // { pin, name, displayName, canSchank, offline }
  let busy = false;
  let resetTimer = null;
  let idleTimer = null;

  // ---------- Lokaler Speicher (überlebt Neuladen und Verbindungsausfall) ----------
  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }

  let queue = lsGet(LS.queue, []);        // gesicherte, noch nicht bestätigte Buchungen (älteste zuerst)
  let rejected = lsGet(LS.rejected, []);  // Buchungen, die der Server endgültig abgelehnt hat
  let clockOffset = Number(lsGet(LS.offset, 0)) || 0; // Serveruhr minus Geräteuhr
  const outcomes = {};                    // Ergebnis je Buchungs-ID (für die Anzeige am Terminal)

  function saveQueue() { lsSet(LS.queue, queue); renderBanner(); }
  function saveRejected() { lsSet(LS.rejected, rejected); renderBanner(); }
  function enqueue(e) { queue.push(e); saveQueue(); }
  function dequeue(id) { queue = queue.filter((x) => x.id !== id); saveQueue(); }

  function correctedNow() { return Date.now() + clockOffset; }
  function noteServerTime(serverNow, t0, t1) {
    if (typeof serverNow === "number" && isFinite(serverNow)) {
      clockOffset = Math.round(serverNow - (t0 + t1) / 2);
      lsSet(LS.offset, clockOffset);
    }
  }

  // PIN -> Name der zuletzt erfolgreich geprüften PINs: damit funktioniert die Anmeldung auch ohne Verbindung
  function rememberPin(p, res) {
    const m = lsGet(LS.pins, {});
    m[p] = { d: res.displayName || res.name, s: !!res.canSchank };
    lsSet(LS.pins, m);
  }
  function knownPin(p) { return lsGet(LS.pins, {})[p] || null; }

  // ---------- Anzeige: Icons, Status, Uhr ----------
  const SVG = (inner) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
  const ICONS = {
    ok: SVG('<path d="M5 13l4 4L19 7"/>'),
    err: SVG('<path d="M6 6l12 12M18 6L6 18"/>'),
    wait: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')
  };

  function shake() {
    const d = $("dots");
    d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
  }

  let linkOk = true;   // Ergebnis der letzten Server-Anfrage
  function setLink(ok) { if (linkOk !== ok) { linkOk = ok; renderStatus(); } }
  function renderStatus() {
    const bad = navigator.onLine === false || !linkOk;
    $("status").classList.toggle("bad", bad);
    $("statusText").textContent = bad ? "Keine Verbindung" : "Verbunden";
  }

  // Die Uhr zeigt die Zeit, die auch gebucht wird (Serveruhr), nicht die Geräteuhr.
  function tickClock() {
    const d = new Date(correctedNow());
    const t = d.toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
    const dt = d.toLocaleDateString("de-DE", { timeZone: "Europe/Berlin", weekday: "long", day: "numeric", month: "long" });
    if ($("clockTime").textContent !== t) $("clockTime").textContent = t;
    if ($("clockDate").textContent !== dt) $("clockDate").textContent = dt;
  }

  // ---------- Hilfsfunktionen ----------
  function show(id) {
    screens.forEach((s) => { $(s).hidden = (s !== id); });
  }

  function fmt(n) {
    const v = Number(n);
    return isNaN(v) ? String(n) : v.toFixed(2).replace(".", ",");
  }

  function timeText(ms) { return new Date(ms).toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" }); }
  function dayText(ms) { return new Date(ms).toLocaleDateString("de-DE", { timeZone: "Europe/Berlin", day: "2-digit", month: "2-digit" }); }

  function newRequestId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* ignorieren */ }
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Ein Versuch. Wirft bei Netzwerkfehler, Zeitüberschreitung, HTTP-Fehler oder unlesbarer Antwort
  // (z. B. HTML-Fehlerseite von Google statt JSON).
  async function apiOnce(payload, timeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const t0 = Date.now();
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = JSON.parse(await res.text());
      if (data && typeof data === "object") noteServerTime(data.serverNow, t0, Date.now());
      return data;
    } finally {
      clearTimeout(t);
    }
  }

  // Mit automatischer Wiederholung. Jeder Versuch trägt dieselbe requestId: Hat der Server die Buchung
  // schon gespeichert, liefert er beim Wiederholen die gespeicherte Antwort statt doppelt zu buchen.
  async function api(payload, opts) {
    const o = Object.assign({ attempts: FG_ATTEMPTS, timeout: FG_TIMEOUT_MS, onRetry: null }, opts || {});
    const body = Object.assign({ requestId: newRequestId() }, payload);
    let lastErr = new Error("Keine Antwort");
    for (let attempt = 1; attempt <= o.attempts; attempt++) {
      try {
        const res = await apiOnce(body, o.timeout);
        setLink(true);
        // retry:true = Server war nur ausgelastet (nichts gespeichert) -> nochmal versuchen
        if (!(res && res.retry === true && attempt < o.attempts)) return res;
        lastErr = new Error("Server ausgelastet");
      } catch (e) {
        lastErr = e;
        setLink(false);
      }
      if (attempt < o.attempts) {
        if (o.onRetry) o.onRetry(attempt + 1);
        await sleep(RETRY_DELAY_MS);
      }
    }
    throw lastErr;
  }

  function netErrorText() {
    return navigator.onLine === false ? "Kein Internet. Bitte WLAN prüfen." : "Der Server antwortet nicht.";
  }

  // ---------- Warteschlange: nichts geht verloren ----------
  // Jede Buchung wird zuerst auf dem Gerät gesichert und dann gesendet. Klappt das nicht, bleibt sie in der
  // Warteschlange und wird automatisch übertragen (mit der echten Stempelzeit), sobald die Verbindung wieder da ist.
  let chain = Promise.resolve();
  function flushQueue(opts) {
    const p = chain.then(() => flushOnce(opts || {}));
    chain = p.catch(() => {});
    return p;
  }

  async function flushOnce(opts) {
    const o = opts.foreground
      ? { attempts: FG_ATTEMPTS, timeout: FG_TIMEOUT_MS, onRetry: opts.onRetry }
      : { attempts: 1, timeout: BG_TIMEOUT_MS };
    while (queue.length) {
      const e = queue[0];
      let res;
      try {
        res = await api({ action: e.action, pin: e.pin, isSchank: e.isSchank, clientTs: e.ts, requestId: e.id }, o);
      } catch (err) {
        return { offline: true };           // Netz/Server nicht erreichbar: Buchung bleibt gesichert
      }
      if (res && res.locked === true) return { offline: true };   // Terminal vorübergehend gesperrt
      if (res && res.retry === true) {                            // Server meldet "bitte später nochmal"
        e.tries = (e.tries || 0) + 1;
        if (e.tries < MAX_SERVER_RETRIES) { saveQueue(); return { offline: true }; }
        res = { status: "error", message: "Server meldet dauerhaft einen Fehler." };
      }
      dequeue(e.id);
      if (res && res.status === "success") {
        outcomes[e.id] = { ok: true, res };
      } else {
        const msg = (res && res.message) || "Unbekannter Fehler";
        outcomes[e.id] = { ok: false, res: res || { message: msg } };
        if (e.id !== opts.focusId) {                              // nicht am Bildschirm angezeigt -> Hinweis auf dem PIN-Bildschirm
          rejected.push({ id: e.id, action: e.action, ts: e.ts, name: e.name || "", message: msg });
          saveRejected();
        }
      }
    }
    return { offline: false };
  }

  function renderBanner() {
    const el = $("banner");
    if (!el) return;
    el.replaceChildren();
    const lines = [];
    if (queue.length) lines.push(queue.length + " Buchung(en) gesichert – werden automatisch übertragen, sobald die Verbindung da ist.");
    rejected.forEach((r) => {
      lines.push("Achtung, " + (r.name || "?") + ": " + (r.action === "kommen" ? "Kommen" : "Gehen") + " " + dayText(r.ts) + " " + timeText(r.ts) +
        " konnte nicht übernommen werden (" + r.message + "). Bitte Chef informieren.");
    });
    lines.forEach((t) => { const d = document.createElement("div"); d.textContent = t; el.appendChild(d); });
    if (rejected.length) {
      const b = document.createElement("button");
      b.className = "btn link"; b.textContent = "Gelesen";
      b.addEventListener("click", () => { rejected = []; saveRejected(); });
      el.appendChild(b);
    }
    el.hidden = lines.length === 0;
  }

  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(resetToPin, IDLE_SECONDS * 1000);
  }

  // ---------- PIN-Screen ----------
  function renderDots() {
    document.querySelectorAll("#dots .dot").forEach((d, i) => d.classList.toggle("on", i < pin.length));
    $("btnNext").disabled = busy || pin.length < 4;
  }

  function pressKey(k) {
    if (busy) return;
    $("pinMsg").textContent = "";
    if (k === "back") pin = pin.slice(0, -1);
    else if (k === "clear") pin = "";
    else if (/^\d$/.test(k) && pin.length < 4) pin += k;
    renderDots();
  }

  async function submitPin() {
    if (busy || pin.length < 4) return;
    busy = true; renderDots();
    $("pinMsg").className = "pin-msg info";
    $("pinMsg").textContent = "Prüfe PIN …";
    try {
      const res = await api({ action: "verifyPin", pin }, {
        onRetry: (n) => { $("pinMsg").textContent = "Verbindung wird erneut versucht … (" + n + "/" + FG_ATTEMPTS + ")"; }
      });
      if (res.status === "success") {
        rememberPin(pin, res);
        session = { pin, name: res.name, displayName: res.displayName || res.name, canSchank: !!res.canSchank, offline: false };
        pin = "";
        openMenu();
      } else {
        $("pinMsg").className = "pin-msg err";
        $("pinMsg").textContent = res.message || "Fehler";
        pin = "";
        shake();
      }
    } catch (e) {
      const k = knownPin(pin);
      if (k) {
        // Keine Verbindung, aber die PIN wurde auf diesem Gerät schon einmal geprüft: Buchen ist trotzdem möglich
        session = { pin, name: k.d, displayName: k.d, canSchank: k.s, offline: true };
        pin = "";
        openMenu();
      } else {
        // PIN bleibt stehen: einfach noch einmal auf "Weiter" tippen
        $("pinMsg").className = "pin-msg err";
        $("pinMsg").textContent = netErrorText() + " Deine PIN kann gerade nicht geprüft werden – bitte gleich erneut auf „Weiter“ tippen.";
      }
    }
    busy = false; renderDots();
  }

  // ---------- Menü ----------
  function openMenu() {
    $("hello").textContent = "Hallo, " + session.displayName + "!";
    $("schankBox").hidden = !session.canSchank;
    $("schankOpt").checked = false;
    $("offlineNote").hidden = !session.offline;
    setMenuDisabled(false);
    show("screenMenu");
    armIdle();
  }

  function setMenuDisabled(d) {
    ["btnKommen", "btnGehen", "btnHistory", "btnCancel"].forEach((id) => { $(id).disabled = d; });
  }

  async function stamp(action) {
    if (busy || !session) return;
    busy = true; setMenuDisabled(true);
    clearTimeout(idleTimer);

    // Zuerst sichern – ab jetzt kann die Buchung nicht mehr verloren gehen. Die Zeit ist die des Tastendrucks.
    const entry = { id: newRequestId(), action, pin: session.pin, isSchank: $("schankOpt").checked, ts: correctedNow(), name: session.displayName };
    enqueue(entry);
    $("hello").textContent = "Speichere …";
    try {
      await flushQueue({
        focusId: entry.id, foreground: true,
        onRetry: (n) => { $("hello").textContent = "Verbindung wird erneut versucht … (" + n + "/" + FG_ATTEMPTS + ")"; }
      });
    } catch (e) { /* Buchung bleibt gesichert */ }

    const out = outcomes[entry.id];
    delete outcomes[entry.id];
    if (out && out.ok) {
      const res = out.res;
      const late = res.replayed ? "Nachträglich übertragen." : "";
      if (action === "kommen") {
        showResult(true, "Willkommen, " + session.displayName + "!", late, null, "ok", { label: "Gekommen", time: res.time, rows: [] });
      } else {
        showResult(true, "Feierabend, " + session.displayName + "!", late, null, "ok", {
          label: "Gegangen", time: res.time,
          rows: [["Heute", fmt(res.todayHours) + " Std."], ["Pause", fmt(res.todayPause) + " h"], ["Monat gesamt", fmt(res.totalMonthHours) + " Std."]]
        });
      }
    } else if (out) {
      rejected = rejected.filter((r) => r.id !== entry.id); saveRejected();
      showResult(false, "Nicht gespeichert", (out.res && out.res.message) || "Unbekannter Fehler");
    } else {
      // Keine Verbindung: Buchung ist gesichert und wird automatisch übertragen
      showResult(true, "Gesichert",
        "Die Verbindung ist gerade gestört. Die Buchung ist auf diesem Gerät gesichert und wird automatisch übertragen, sobald sie wieder da ist. Du musst nichts weiter tun.",
        10, "wait", { label: action === "kommen" ? "Kommen" : "Gehen", time: timeText(entry.ts), rows: [] });
    }
    busy = false;
  }

  // ---------- Ergebnis ----------
  function showResult(ok, title, detail, seconds, kind, ticket) {
    const secs = seconds || RESET_SECONDS;
    const k = kind || (ok ? "ok" : "err");
    $("resultBox").className = "result " + k;
    $("resIcon").innerHTML = ICONS[k];   // nur feste Konstanten, keine Nutzereingaben
    $("resTitle").textContent = title;
    $("ticketWrap").hidden = !ticket;
    if (ticket) {
      $("tkLabel").textContent = ticket.label;
      $("tkTime").textContent = ticket.time;
      const rows = $("tkRows");
      rows.replaceChildren();
      (ticket.rows || []).forEach((r) => {
        const d = document.createElement("div");
        d.className = "tk-row";
        const a = document.createElement("span"); a.textContent = r[0];
        const b = document.createElement("b"); b.textContent = r[1];
        d.appendChild(a); d.appendChild(b);
        rows.appendChild(d);
      });
    }
    $("resDetail").textContent = detail || "";
    $("resDetail").hidden = !detail;
    show("screenResult");

    const bar = $("bar");
    bar.classList.remove("run"); void bar.offsetWidth;
    bar.firstElementChild.style.animationDuration = secs + "s";
    bar.classList.add("run");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetToPin, secs * 1000);
  }

  // ---------- Verlauf ----------
  // zwei Schichten pro Tag: "10:00 / 18:00"
  function joinShifts(a, b) { return [a, b].filter(Boolean).join(" / ") || "–"; }

  async function openHistory() {
    if (busy || !session) return;
    busy = true;
    $("histTitle").textContent = "Arbeitszeiten: " + session.displayName;
    $("histLoading").hidden = false;
    $("histWrap").hidden = true;
    $("histTotal").hidden = true;
    $("histBody").replaceChildren();
    show("screenHistory");
    armIdle();

    try {
      const res = await api({ action: "getHistory", pin: session.pin }, {
        onRetry: (n) => {
          $("histLoading").hidden = false;
          $("histLoading").textContent = "Verbindung wird erneut versucht … (" + n + "/" + FG_ATTEMPTS + ")";
        }
      });
      $("histLoading").hidden = true;
      if (res.status !== "success") {
        $("histLoading").hidden = false;
        $("histLoading").textContent = res.message || "Fehler beim Laden.";
      } else {
        const body = $("histBody");
        if (!res.history || res.history.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 5; td.className = "empty"; td.textContent = "Noch keine Schichten erfasst.";
          tr.appendChild(td); body.appendChild(tr);
        } else {
          res.history.forEach((r) => {
            const tr = document.createElement("tr");
            [r.day, joinShifts(r.von, r.von2), joinShifts(r.bis, r.bis2), r.pause !== "" && r.pause !== 0 ? fmt(r.pause) + " h" : "–", r.std !== "" ? fmt(r.std) : "–"].forEach((v, i) => {
              const td = document.createElement("td");
              td.textContent = v;
              if (i === 4) td.style.fontWeight = "700";
              tr.appendChild(td);
            });
            body.appendChild(tr);
          });
        }
        $("histWrap").hidden = false;
        $("histTotal").textContent = "Gesamt Monat: " + fmt(res.totalMonthHours) + " Std.";
        $("histTotal").hidden = false;
      }
    } catch (e) {
      $("histLoading").hidden = false;
      $("histLoading").textContent = netErrorText() + " Bitte erneut versuchen.";
    }
    busy = false;
  }

  // ---------- Zurücksetzen ----------
  function resetToPin() {
    clearTimeout(resetTimer);
    clearTimeout(idleTimer);
    session = null; pin = ""; busy = false;
    $("pinMsg").className = "pin-msg";
    $("pinMsg").textContent = "";
    $("schankOpt").checked = false;
    $("histBody").replaceChildren();
    renderDots();
    renderBanner();
    show("screenPin");
  }

  // ---------- Events ----------
  $("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (b) pressKey(b.dataset.k);
  });
  $("btnNext").addEventListener("click", submitPin);
  $("btnKommen").addEventListener("click", () => stamp("kommen"));
  $("btnGehen").addEventListener("click", () => stamp("gehen"));
  $("btnHistory").addEventListener("click", openHistory);
  $("btnCancel").addEventListener("click", resetToPin);
  $("btnNow").addEventListener("click", resetToPin);
  $("btnHistBack").addEventListener("click", () => { if (session) openMenu(); else resetToPin(); });
  $("btnHistDone").addEventListener("click", resetToPin);

  // Aktivität verlängert die Inaktivitäts-Frist (Menü + Verlauf)
  document.addEventListener("pointerdown", () => {
    if (!$("screenMenu").hidden || !$("screenHistory").hidden) armIdle();
  });

  // Hardware-Tastatur (falls vorhanden)
  document.addEventListener("keydown", (e) => {
    if ($("screenPin").hidden) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") pressKey("back");
    else if (e.key === "Escape") pressKey("clear");
    else if (e.key === "Enter") submitPin();
  });

  // Gesicherte Buchungen automatisch übertragen: beim Start, bei zurückkehrender Verbindung, beim Zurückkehren
  // in die App und alle 30 Sekunden.
  function syncPending() { if (queue.length && !busy) flushQueue({}).catch(() => {}); }
  window.addEventListener("online", () => { renderStatus(); syncPending(); });
  window.addEventListener("offline", renderStatus);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAlive(); syncPending(); } });
  setInterval(syncPending, SYNC_INTERVAL_MS);

  // Hält die Web-App warm (Kaltstarts nach Leerlauf sind eine häufige Ursache für Zeitüberschreitungen)
  // und gleicht die Geräteuhr mit der Serveruhr ab.
  function keepAlive() {
    try {
      const t0 = Date.now();
      fetch(WEB_APP_URL, { cache: "no-store" })
        .then((r) => r.json())
        .then((j) => { noteServerTime(j && j.serverNow, t0, Date.now()); if (j && j.serverNow) setLink(true); })
        .catch(() => {});
    } catch (e) { /* ignorieren */ }
  }
  keepAlive();
  setInterval(keepAlive, KEEPALIVE_MS);

  tickClock();
  setInterval(tickClock, 1000);
  renderStatus();
  resetToPin();
  syncPending();
</script>
</body>
</html>
