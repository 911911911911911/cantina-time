<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cantina Zeiterfassung</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #263449;
      --text: #f8fafc;
      --sub: #94a3b8;
      --border: #334155;
      --green: #22c55e;
      --green-h: #16a34a;
      --red: #ef4444;
      --red-h: #dc2626;
      --blue: #3b82f6;
      --blue-h: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, var(--bg) 60%);
      color: var(--text);
      display: flex; justify-content: center; align-items: center;
      padding: 16px; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    .card {
      width: 100%; max-width: 520px;
      background: var(--card); border: 1px solid var(--border); border-radius: 22px;
      padding: clamp(18px, 4vw, 32px);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: clamp(12px, 2.2vh, 20px);
    }
    [hidden] { display: none !important; }
    h1 { font-size: clamp(1.3rem, 3.4vw, 1.7rem); text-align: center; letter-spacing: -.4px; }
    .subtitle { text-align: center; color: var(--sub); font-size: .9rem; margin-top: -8px; }

    /* PIN */
    .dots { display: flex; justify-content: center; gap: 16px; padding: 6px 0; }
    .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--sub); transition: all .12s; }
    .dot.on { background: var(--blue); border-color: var(--blue); transform: scale(1.1); }
    .pin-msg { min-height: 1.4em; text-align: center; font-size: .95rem; color: #f87171; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.8vw, 14px); }
    .key {
      background: var(--card-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 16px; font-size: clamp(1.5rem, 4.5vw, 2rem); font-weight: 600;
      height: clamp(58px, 10vh, 84px); cursor: pointer; touch-action: manipulation;
      transition: transform .06s, background .15s;
    }
    .key:active { transform: scale(.96); background: #324562; }
    .key.fn { font-size: 1.3rem; color: var(--sub); background: transparent; }

    /* Buttons */
    .btn {
      border: none; border-radius: 16px; color: #fff; font-weight: 700; cursor: pointer;
      font-size: clamp(1.1rem, 3.2vw, 1.35rem); padding: clamp(16px, 3vh, 24px) 12px;
      touch-action: manipulation; transition: transform .06s, background .15s, opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.blue { background: var(--blue); } .btn.blue:hover:not(:disabled) { background: var(--blue-h); }
    .btn.green { background: var(--green); } .btn.green:hover:not(:disabled) { background: var(--green-h); }
    .btn.red { background: var(--red); } .btn.red:hover:not(:disabled) { background: var(--red-h); }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 1.05rem; padding: 14px; }
    .btn.link { background: transparent; color: var(--sub); font-weight: 500; font-size: .95rem; padding: 10px; }

    /* Menü */
    .hello { text-align: center; font-size: clamp(1.5rem, 4.6vw, 2.1rem); font-weight: 700; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .schank {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3);
      border-radius: 14px; padding: 14px; color: #93c5fd; font-weight: 600; font-size: 1.05rem; cursor: pointer;
    }
    .schank input { width: 26px; height: 26px; accent-color: var(--blue); }

    /* Ergebnis */
    .result { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 8px 0; }
    .result .icon { font-size: 3.6rem; line-height: 1; }
    .result .title { font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 700; }
    .result .detail { color: var(--sub); font-size: 1.05rem; line-height: 1.5; }
    .result.ok .title { color: #4ade80; } .result.err .title { color: #f87171; }
    .bar { width: 100%; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 100%; background: var(--blue); transform-origin: left; }
    .bar.run > i { animation: shrink 5s linear forwards; }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* Verlauf */
    .hist-wrap { max-height: 52vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    th { position: sticky; top: 0; background: var(--card-2); color: var(--sub); text-align: left; padding: 10px 8px; font-weight: 600; }
    td { padding: 11px 8px; border-top: 1px solid rgba(51,65,85,.6); }
    .total { text-align: center; color: #38bdf8; font-weight: 700; font-size: 1.1rem; }
    .empty { text-align: center; color: var(--sub); padding: 18px; }
    .spinner { text-align: center; color: var(--sub); padding: 18px; }

    /* Hinweise (gesicherte / abgelehnte Buchungen, Offline-Modus) */
    .notice { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); color: #fcd34d; border-radius: 14px; padding: 10px 14px; font-size: .92rem; line-height: 1.45; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  </style>
</head>
<body>

  <!-- 1) PIN-Eingabe -->
  <main class="card" id="screenPin">
    <h1>Cantina Zeiterfassung</h1>
    <div class="subtitle">Pasinger Fabrik · PIN eingeben</div>
    <div class="notice" id="banner" hidden></div>
    <div class="dots" id="dots" aria-label="PIN-Eingabe">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="pin-msg" id="pinMsg" role="alert"></div>
    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key fn" data-k="clear" aria-label="Löschen">C</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="back" aria-label="Zurück">⌫</button>
    </div>
    <button class="btn blue" id="btnNext" disabled>Weiter</button>
  </main>

  <!-- 2) Menü -->
  <main class="card" id="screenMenu" hidden>
    <div class="hello" id="hello">Hallo!</div>
    <div class="notice" id="offlineNote" hidden>Keine Verbindung – deine Buchung wird gesichert und automatisch übertragen.</div>
    <label class="schank" id="schankBox" hidden>
      <input type="checkbox" id="schankOpt"> Schankdienst (S)
    </label>
    <div class="row2">
      <button class="btn green" id="btnKommen">🟢 Kommen</button>
      <button class="btn red" id="btnGehen">🔴 Gehen</button>
    </div>
    <button class="btn ghost" id="btnHistory">📋 Meine Arbeitszeiten</button>
    <button class="btn link" id="btnCancel">Abbrechen</button>
  </main>

  <!-- 3) Ergebnis -->
  <main class="card" id="screenResult" hidden>
    <div class="result" id="resultBox">
      <div class="icon" id="resIcon"></div>
      <div class="title" id="resTitle"></div>
      <div class="detail" id="resDetail"></div>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <button class="btn link" id="btnNow">Sofort zurück</button>
  </main>

  <!-- 4) Verlauf -->
  <main class="card" id="screenHistory" hidden>
    <h1 id="histTitle">Meine Arbeitszeiten</h1>
    <div id="histLoading" class="spinner">Laden …</div>
    <div class="hist-wrap" id="histWrap" hidden>
      <table>
        <thead><tr><th>Tag</th><th>Von</th><th>Bis</th><th>Pause</th><th>Std.</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
    <div class="total" id="histTotal" hidden></div>
    <button class="btn ghost" id="btnHistBack">Zurück</button>
    <button class="btn link" id="btnHistDone">Fertig</button>
  </main>

<script>
  // URL der Apps-Script-Web-App (bei "Bereitstellungen verwalten -> Neue Version" bleibt sie gleich)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOJxviLIIfidTsMS8zzbZYa9rwH4th19HOooerig0CtOwgcB32QGfD6_aOiRKs7677dA/exec";
  const RESET_SECONDS = 5;            // Rücksprung nach Erfolg/Fehler
  const IDLE_SECONDS = 45;            // Rücksprung bei Inaktivität im Menü/Verlauf
  const FG_TIMEOUT_MS = 12000;        // Vordergrund: Wartezeit pro Versuch
  const FG_ATTEMPTS = 2;              // Vordergrund: Versuche; danach wird die Buchung gesichert und später übertragen
  const BG_TIMEOUT_MS = 20000;        // Hintergrund-Übertragung: Wartezeit pro Versuch
  const RETRY_DELAY_MS = 1500;
  const SYNC_INTERVAL_MS = 30000;     // so oft wird eine gesicherte Buchung erneut übertragen
  const MAX_SERVER_RETRIES = 20;      // so oft darf der Server "bitte wiederholen" melden, bevor die Buchung als Problem gemeldet wird
  const KEEPALIVE_MS = 4 * 60 * 1000; // hält die Web-App warm (weniger Kaltstart-Verzögerung)
  const LS = { queue: "cz_queue_v1", rejected: "cz_rejected_v1", pins: "cz_pins_v1", offset: "cz_offset_v1" };

  const $ = (id) => document.getElementById(id);
  const screens = ["screenPin", "screenMenu", "screenResult", "screenHistory"];

  let pin = "";
  let session = null;      // { pin, name, displayName, canSchank, offline }
  let busy = false;
  let resetTimer = null;
  let idleTimer = null;

  // ---------- Lokaler Speicher (überlebt Neuladen und Verbindungsausfall) ----------
  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }

  let queue = lsGet(LS.queue, []);        // gesicherte, noch nicht bestätigte Buchungen (älteste zuerst)
  let rejected = lsGet(LS.rejected, []);  // Buchungen, die der Server endgültig abgelehnt hat
  let clockOffset = Number(lsGet(LS.offset, 0)) || 0; // Serveruhr minus Geräteuhr
  const outcomes = {};                    // Ergebnis je Buchungs-ID (für die Anzeige am Terminal)

  function saveQueue() { lsSet(LS.queue, queue); renderBanner(); }
  function saveRejected() { lsSet(LS.rejected, rejected); renderBanner(); }
  function enqueue(e) { queue.push(e); saveQueue(); }
  function dequeue(id) { queue = queue.filter((x) => x.id !== id); saveQueue(); }

  function correctedNow() { return Date.now() + clockOffset; }
  function noteServerTime(serverNow, t0, t1) {
    if (typeof serverNow === "number" && isFinite(serverNow)) {
      clockOffset = Math.round(serverNow - (t0 + t1) / 2);
      lsSet(LS.offset, clockOffset);
    }
  }

  // PIN -> Name der zuletzt erfolgreich geprüften PINs: damit funktioniert die Anmeldung auch ohne Verbindung
  function rememberPin(p, res) {
    const m = lsGet(LS.pins, {});
    m[p] = { d: res.displayName || res.name, s: !!res.canSchank };
    lsSet(LS.pins, m);
  }
  function knownPin(p) { return lsGet(LS.pins, {})[p] || null; }

  // ---------- Hilfsfunktionen ----------
  function show(id) {
    screens.forEach((s) => { $(s).hidden = (s !== id); });
  }

  function fmt(n) {
    const v = Number(n);
    return isNaN(v) ? String(n) : v.toFixed(2).replace(".", ",");
  }

  function timeText(ms) { return new Date(ms).toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" }); }
  function dayText(ms) { return new Date(ms).toLocaleDateString("de-DE", { timeZone: "Europe/Berlin", day: "2-digit", month: "2-digit" }); }

  function newRequestId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* ignorieren */ }
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Ein Versuch. Wirft bei Netzwerkfehler, Zeitüberschreitung, HTTP-Fehler oder unlesbarer Antwort
  // (z. B. HTML-Fehlerseite von Google statt JSON).
  async function apiOnce(payload, timeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const t0 = Date.now();
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = JSON.parse(await res.text());
      if (data && typeof data === "object") noteServerTime(data.serverNow, t0, Date.now());
      return data;
    } finally {
      clearTimeout(t);
    }
  }

  // Mit automatischer Wiederholung. Jeder Versuch trägt dieselbe requestId: Hat der Server die Buchung
  // schon gespeichert, liefert er beim Wiederholen die gespeicherte Antwort statt doppelt zu buchen.
  async function api(payload, opts) {
    const o = Object.assign({ attempts: FG_ATTEMPTS, timeout: FG_TIMEOUT_MS, onRetry: null }, opts || {});
    const body = Object.assign({ requestId: newRequestId() }, payload);
    let lastErr = new Error("Keine Antwort");
    for (let attempt = 1; attempt <= o.attempts; attempt++) {
      try {
        const res = await apiOnce(body, o.timeout);
        // retry:true = Server war nur ausgelastet (nichts gespeichert) -> nochmal versuchen
        if (!(res && res.retry === true && attempt < o.attempts)) return res;
        lastErr = new Error("Server ausgelastet");
      } catch (e) {
        lastErr = e;
      }
      if (attempt < o.attempts) {
        if (o.onRetry) o.onRetry(attempt + 1);
        await sleep(RETRY_DELAY_MS);
      }
    }
    throw lastErr;
  }

  function netErrorText() {
    return navigator.onLine === false ? "Kein Internet. Bitte WLAN prüfen." : "Der Server antwortet nicht.";
  }

  // ---------- Warteschlange: nichts geht verloren ----------
  // Jede Buchung wird zuerst auf dem Gerät gesichert und dann gesendet. Klappt das nicht, bleibt sie in der
  // Warteschlange und wird automatisch übertragen (mit der echten Stempelzeit), sobald die Verbindung wieder da ist.
  let chain = Promise.resolve();
  function flushQueue(opts) {
    const p = chain.then(() => flushOnce(opts || {}));
    chain = p.catch(() => {});
    return p;
  }

  async function flushOnce(opts) {
    const o = opts.foreground
      ? { attempts: FG_ATTEMPTS, timeout: FG_TIMEOUT_MS, onRetry: opts.onRetry }
      : { attempts: 1, timeout: BG_TIMEOUT_MS };
    while (queue.length) {
      const e = queue[0];
      let res;
      try {
        res = await api({ action: e.action, pin: e.pin, isSchank: e.isSchank, clientTs: e.ts, requestId: e.id }, o);
      } catch (err) {
        return { offline: true };           // Netz/Server nicht erreichbar: Buchung bleibt gesichert
      }
      if (res && res.locked === true) return { offline: true };   // Terminal vorübergehend gesperrt
      if (res && res.retry === true) {                            // Server meldet "bitte später nochmal"
        e.tries = (e.tries || 0) + 1;
        if (e.tries < MAX_SERVER_RETRIES) { saveQueue(); return { offline: true }; }
        res = { status: "error", message: "Server meldet dauerhaft einen Fehler." };
      }
      dequeue(e.id);
      if (res && res.status === "success") {
        outcomes[e.id] = { ok: true, res };
      } else {
        const msg = (res && res.message) || "Unbekannter Fehler";
        outcomes[e.id] = { ok: false, res: res || { message: msg } };
        if (e.id !== opts.focusId) {                              // nicht am Bildschirm angezeigt -> Hinweis auf dem PIN-Bildschirm
          rejected.push({ id: e.id, action: e.action, ts: e.ts, name: e.name || "", message: msg });
          saveRejected();
        }
      }
    }
    return { offline: false };
  }

  function renderBanner() {
    const el = $("banner");
    if (!el) return;
    el.replaceChildren();
    const lines = [];
    if (queue.length) lines.push("🕒 " + queue.length + " Buchung(en) gesichert – werden automatisch übertragen, sobald die Verbindung da ist.");
    rejected.forEach((r) => {
      lines.push("⚠ " + (r.name || "?") + ": " + (r.action === "kommen" ? "Kommen" : "Gehen") + " " + dayText(r.ts) + " " + timeText(r.ts) +
        " konnte nicht übernommen werden (" + r.message + "). Bitte Chef informieren.");
    });
    lines.forEach((t) => { const d = document.createElement("div"); d.textContent = t; el.appendChild(d); });
    if (rejected.length) {
      const b = document.createElement("button");
      b.className = "btn link"; b.textContent = "Gelesen";
      b.addEventListener("click", () => { rejected = []; saveRejected(); });
      el.appendChild(b);
    }
    el.hidden = lines.length === 0;
  }

  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(resetToPin, IDLE_SECONDS * 1000);
  }

  // ---------- PIN-Screen ----------
  function renderDots() {
    document.querySelectorAll("#dots .dot").forEach((d, i) => d.classList.toggle("on", i < pin.length));
    $("btnNext").disabled = busy || pin.length < 4;
  }

  function pressKey(k) {
    if (busy) return;
    $("pinMsg").textContent = "";
    if (k === "back") pin = pin.slice(0, -1);
    else if (k === "clear") pin = "";
    else if (/^\d$/.test(k) && pin.length < 4) pin += k;
    renderDots();
  }

  async function submitPin() {
    if (busy || pin.length < 4) return;
    busy = true; renderDots();
    $("pinMsg").style.color = "#94a3b8";
    $("pinMsg").textContent = "Prüfe PIN …";
    try {
      const res = await api({ action: "verifyPin", pin }, {
        onRetry: (n) => { $("pinMsg").textContent = "Verbindung wird erneut versucht … (" + n + "/" + FG_ATTEMPTS + ")"; }
      });
      if (res.status === "success") {
        rememberPin(pin, res);
        session = { pin, name: res.name, displayName: res.displayName || res.name, canSchank: !!res.canSchank, offline: false };
        pin = "";
        openMenu();
      } else {
        $("pinMsg").style.color = "#f87171";
        $("pinMsg").textContent = res.message || "Fehler";
        pin = "";
      }
    } catch (e) {
      const k = knownPin(pin);
      if (k) {
        // Keine Verbindung, aber die PIN wurde auf diesem Gerät schon einmal geprüft: Buchen ist trotzdem möglich
        session = { pin, name: k.d, displayName: k.d, canSchank: k.s, offline: true };
        pin = "";
        openMenu();
      } else {
        // PIN bleibt stehen: einfach noch einmal auf "Weiter" tippen
        $("pinMsg").style.color = "#f87171";
        $("pinMsg").textContent = netErrorText() + " Deine PIN kann gerade nicht geprüft werden – bitte gleich erneut auf „Weiter“ tippen.";
      }
    }
    busy = false; renderDots();
  }

  // ---------- Menü ----------
  function openMenu() {
    $("hello").textContent = "Hallo, " + session.displayName + "!";
    $("schankBox").hidden = !session.canSchank;
    $("schankOpt").checked = false;
    $("offlineNote").hidden = !session.offline;
    setMenuDisabled(false);
    show("screenMenu");
    armIdle();
  }

  function setMenuDisabled(d) {
    ["btnKommen", "btnGehen", "btnHistory", "btnCancel"].forEach((id) => { $(id).disabled = d; });
  }

  async function stamp(action) {
    if (busy || !session) return;
    busy = true; setMenuDisabled(true);
    clearTimeout(idleTimer);

    // Zuerst sichern – ab jetzt kann die Buchung nicht mehr verloren gehen. Die Zeit ist die des Tastendrucks.
    const entry = { id: newRequestId(), action, pin: session.pin, isSchank: $("schankOpt").checked, ts: correctedNow(), name: session.displayName };
    enqueue(entry);
    $("hello").textContent = "Speichere …";
    try {
      await flushQueue({
        focusId: entry.id, foreground: true,
        onRetry: (n) => { $("hello").textContent = "Verbindung wird erneut versucht … (" + n + "/" + FG_ATTEMPTS + ")"; }
      });
    } catch (e) { /* Buchung bleibt gesichert */ }

    const out = outcomes[entry.id];
    delete outcomes[entry.id];
    if (out && out.ok) {
      const res = out.res;
      const late = res.replayed ? "\n(Nachträglich übertragen)" : "";
      if (action === "kommen") {
        showResult(true, "Willkommen, " + session.displayName + "!", "Gekommen um " + res.time + " Uhr erfasst." + late);
      } else {
        showResult(true, "Feierabend, " + session.displayName + "!",
          "Gegangen um " + res.time + " Uhr.\nHeute: " + fmt(res.todayHours) + " Std. (Pause: " + fmt(res.todayPause) + " h)\nMonat gesamt: " + fmt(res.totalMonthHours) + " Std." + late);
      }
    } else if (out) {
      rejected = rejected.filter((r) => r.id !== entry.id); saveRejected();
      showResult(false, "Nicht gespeichert", (out.res && out.res.message) || "Unbekannter Fehler");
    } else {
      // Keine Verbindung: Buchung ist gesichert und wird automatisch übertragen
      showResult(true, "Gesichert",
        (action === "kommen" ? "Kommen" : "Gehen") + " um " + timeText(entry.ts) + " Uhr ist auf diesem Gerät gesichert.\n" +
        "Die Verbindung ist gerade gestört – die Buchung wird automatisch übertragen, sobald sie wieder da ist. Du musst nichts weiter tun.", 10, "🕒");
    }
    busy = false;
  }

  // ---------- Ergebnis ----------
  function showResult(ok, title, detail, seconds, icon) {
    const secs = seconds || RESET_SECONDS;
    $("resultBox").className = "result " + (ok ? "ok" : "err");
    $("resIcon").textContent = icon || (ok ? "✅" : "❌");
    $("resTitle").textContent = title;
    $("resDetail").textContent = detail;
    $("resDetail").style.whiteSpace = "pre-line";
    show("screenResult");

    const bar = $("bar");
    bar.classList.remove("run"); void bar.offsetWidth;
    bar.firstElementChild.style.animationDuration = secs + "s";
    bar.classList.add("run");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetToPin, secs * 1000);
  }

  // ---------- Verlauf ----------
  // zwei Schichten pro Tag: "10:00 / 18:00"
  function joinShifts(a, b) { return [a, b].filter(Boolean).join(" / ") || "–"; }

  async function openHistory() {
    if (busy || !session) return;
    busy = true;
    $("histTitle").textContent = "Arbeitszeiten: " + session.displayName;
    $("histLoading").hidden = false;
    $("histWrap").hidden = true;
    $("histTotal").hidden = true;
    $("histBody").replaceChildren();
    show("screenHistory");
    armIdle();

    try {
      const res = await api({ action: "getHistory", pin: session.pin }, {
        onRetry: (n) => {
          $("histLoading").hidden = false;
          $("histLoading").textContent = "Verbindung wird erneut versucht … (" + n + "/" + FG_ATTEMPTS + ")";
        }
      });
      $("histLoading").hidden = true;
      if (res.status !== "success") {
        $("histLoading").hidden = false;
        $("histLoading").textContent = res.message || "Fehler beim Laden.";
      } else {
        const body = $("histBody");
        if (!res.history || res.history.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 5; td.className = "empty"; td.textContent = "Noch keine Schichten erfasst.";
          tr.appendChild(td); body.appendChild(tr);
        } else {
          res.history.forEach((r) => {
            const tr = document.createElement("tr");
            [r.day, joinShifts(r.von, r.von2), joinShifts(r.bis, r.bis2), r.pause !== "" && r.pause !== 0 ? fmt(r.pause) + " h" : "–", r.std !== "" ? fmt(r.std) : "–"].forEach((v, i) => {
              const td = document.createElement("td");
              td.textContent = v;
              if (i === 4) td.style.fontWeight = "700";
              tr.appendChild(td);
            });
            body.appendChild(tr);
          });
        }
        $("histWrap").hidden = false;
        $("histTotal").textContent = "Gesamt Monat: " + fmt(res.totalMonthHours) + " Std.";
        $("histTotal").hidden = false;
      }
    } catch (e) {
      $("histLoading").hidden = false;
      $("histLoading").textContent = netErrorText() + " Bitte erneut versuchen.";
    }
    busy = false;
  }

  // ---------- Zurücksetzen ----------
  function resetToPin() {
    clearTimeout(resetTimer);
    clearTimeout(idleTimer);
    session = null; pin = ""; busy = false;
    $("pinMsg").textContent = "";
    $("schankOpt").checked = false;
    $("histBody").replaceChildren();
    renderDots();
    renderBanner();
    show("screenPin");
  }

  // ---------- Events ----------
  $("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (b) pressKey(b.dataset.k);
  });
  $("btnNext").addEventListener("click", submitPin);
  $("btnKommen").addEventListener("click", () => stamp("kommen"));
  $("btnGehen").addEventListener("click", () => stamp("gehen"));
  $("btnHistory").addEventListener("click", openHistory);
  $("btnCancel").addEventListener("click", resetToPin);
  $("btnNow").addEventListener("click", resetToPin);
  $("btnHistBack").addEventListener("click", () => { if (session) openMenu(); else resetToPin(); });
  $("btnHistDone").addEventListener("click", resetToPin);

  // Aktivität verlängert die Inaktivitäts-Frist (Menü + Verlauf)
  document.addEventListener("pointerdown", () => {
    if (!$("screenMenu").hidden || !$("screenHistory").hidden) armIdle();
  });

  // Hardware-Tastatur (falls vorhanden)
  document.addEventListener("keydown", (e) => {
    if ($("screenPin").hidden) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") pressKey("back");
    else if (e.key === "Escape") pressKey("clear");
    else if (e.key === "Enter") submitPin();
  });

  // Doppeltipp-Zoom verhindern
  let lastTouch = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  // Gesicherte Buchungen automatisch übertragen: beim Start, bei zurückkehrender Verbindung, beim Zurückkehren
  // in die App und alle 30 Sekunden.
  function syncPending() { if (queue.length && !busy) flushQueue({}).catch(() => {}); }
  window.addEventListener("online", syncPending);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAlive(); syncPending(); } });
  setInterval(syncPending, SYNC_INTERVAL_MS);

  // Hält die Web-App warm (Kaltstarts nach Leerlauf sind eine häufige Ursache für Zeitüberschreitungen)
  // und gleicht die Geräteuhr mit der Serveruhr ab.
  function keepAlive() {
    try {
      const t0 = Date.now();
      fetch(WEB_APP_URL, { cache: "no-store" })
        .then((r) => r.json())
        .then((j) => noteServerTime(j && j.serverNow, t0, Date.now()))
        .catch(() => {});
    } catch (e) { /* ignorieren */ }
  }
  keepAlive();
  setInterval(keepAlive, KEEPALIVE_MS);

  resetToPin();
  syncPending();
</script>
</body>
</html>
